<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#14213d;--mute:#667085;--line:#e1e6ee;--navy:#0b4a8f;--navy2:#083a72;--gold:#f2c500;--acc:#0b4a8f;--acc2:#eaf0f8;--bad:#b42318;--badbg:#fde8e6;--g7:#0b4a8f;--g8:#8a6a00;--g9:#0e6e4a;--today:#fff6cc;--c7:#e3edf9;--c8:#fbf0c4;--c9:#dff1e8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#161f31;--ink:#e8edf6;--mute:#93a0b5;--line:#26334a;--acc:#8db7f0;--acc2:#1b2a45;--bad:#ff8a80;--badbg:#3a1f1d;--g7:#8db7f0;--g8:#f0cf55;--g9:#6fd0a0;--today:#3a3410;--c7:#1c3358;--c8:#40370f;--c9:#173a2b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:28px}
header{background:var(--navy2);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:14px;max-width:1100px;margin:auto}
.brand img{width:64px;height:64px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.brand small{display:block;font-size:.8rem;letter-spacing:.03em;color:#cfdcf0}
h1{font:600 1.45rem/1.2 Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:2px 0 0}
#st{font-size:.76rem;color:#b9c9e3;margin-top:4px}#st.err{color:#ffd27a}
button,select,input{font:inherit;color:inherit}
.bar{display:flex;padding:0 10px;overflow-x:auto;position:sticky;top:0;background:var(--card);z-index:5;border-bottom:1px solid var(--line)}
.bar button{border:0;background:none;padding:13px 14px 10px;white-space:nowrap;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;font-weight:500}
.bar button[aria-pressed=true]{color:var(--acc);border-bottom-color:var(--gold);font-weight:700}
.bar #re{margin-left:auto;color:var(--acc)}
.bar button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding:16px 14px;max-width:1100px;margin:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row>*{flex:1 1 150px;min-width:0}
select,input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--acc2);color:var(--acc);font-size:.82rem;font-weight:600}
.chip.g7{background:var(--c7);color:var(--g7)}.chip.g8{background:var(--c8);color:var(--g8)}.chip.g9{background:var(--c9);color:var(--g9)}
.chip.free{background:transparent;border:1px solid var(--line);font-weight:400;color:var(--ink)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 1px 3px rgba(16,24,40,.06)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--navy2);color:#fff;font-weight:600;position:sticky;top:0;border-color:rgba(255,255,255,.12)}
th.today{background:var(--gold);color:#14213d}
th:first-child,td:first-child{position:sticky;left:0;width:44px;text-align:center;font-weight:700;z-index:1}
td:first-child{background:var(--acc2);color:var(--acc)}
tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}
td.today{background:var(--today)}
.m{color:var(--mute);font-size:.78rem}
td.bad{background:var(--badbg);color:var(--bad);font-weight:600}
.ev td{background:var(--acc2);text-align:center;font-weight:600;color:var(--acc)}
.sec{margin:20px 0 8px;font:600 1.15rem/1.3 Georgia,"Iowan Old Style","Palatino Linotype",serif}
.empty{padding:32px 10px;text-align:center;color:var(--mute)}
.cl{white-space:nowrap}
</style>
</head>

<nav class="bar" id="tabs">
  <button data-v="guru" aria-pressed="true">Guru</button>
  <button data-v="kelas" aria-pressed="false">Kelas</button>
  <button data-v="jam" aria-pressed="false">Per jam</button>
  <button data-v="bentrok" aria-pressed="false">Cek bentrok</button>
  <button id="re" aria-pressed="false">Muat ulang</button>
</nav>
<main id="app"></main>

<script>
// ====== ISI DENGAN URL WEB APP (berakhiran /exec) ======
const API_URL = "https://script.google.com/macros/s/AKfycbz9IVG_SCDrjJOxhHsSSY1SOJjYd9B0-5tGBnNI7edDSmn2MMf4t7A1oeUFanF3GAn4/exec";
// =======================================================

const LS = "jadwal-cache-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse = v => (String(v).match(/\d+/g) || []).map(Number);
const gname = k => (D.guru[k] || "Kode " + k);
const short = k => gname(k).split(",")[0].trim();
const chip = n => `<span class="chip g${String(n)[0]}">${esc(n)}</span>`;
const jamLabel = j => j;

let D, teach, cls, ev, maxJam, view = "guru", sel = {};

function setStatus(t, err){ const s = $("#st"); s.textContent = t; s.className = err ? "err" : ""; }

async function load(refresh){
  if (API_URL.startsWith("GANTI")) { setStatus("API_URL belum diisi. Buka jadwal.html dan tempel URL web app (/exec).", true); return; }
  setStatus("Memuat data…");
  try {
    const r = await fetch(API_URL + (refresh ? (API_URL.includes("?") ? "&" : "?") + "refresh=1" : ""));
    D = await r.json();
    if (!D.hari) throw new Error("format");
    try { localStorage.setItem(LS, JSON.stringify(D)); } catch (e) {}
    setStatus("Diperbarui " + new Date(D.updated).toLocaleString("id-ID"));
  } catch (e) {
    let c = null; try { c = JSON.parse(localStorage.getItem(LS)); } catch (_) {}
    if (!c) { setStatus("Data gagal dimuat. Pastikan web app di-deploy dengan akses \u201CAnyone\u201D.", true); return; }
    D = c; setStatus("Offline, memakai data tersimpan (" + new Date(D.updated).toLocaleString("id-ID") + ")", true);
  }
  prepare(); render();
}

function prepare(){
  teach = {}; cls = D.hari.map(() => ({})); ev = D.hari.map(() => ({})); maxJam = 0;
  D.hari.forEach((h, d) => h.rows.forEach(r => {
    if (r.cells) {
      maxJam = Math.max(maxJam, r.jam);
      cls[d][r.jam] = r.cells.map(parse);
      cls[d][r.jam].forEach((gs, k) => gs.forEach(g => (teach[g] = teach[g] || []).push({d, j: r.jam, k})));
    } else if (r.jam) ev[d][r.jam] = r.label;
  }));
  const t = ["MINGGU","SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU"][new Date().getDay()];
  const td = D.hari.findIndex(h => h.nama === t);
  sel.today = td;
  sel.d = sel.d ?? Math.max(td, 0);
}

function conflicts(){
  const out = [];
  for (const g in teach) {
    const m = {};
    teach[g].forEach(x => (m[x.d + "_" + x.j] = m[x.d + "_" + x.j] || []).push(x.k));
    for (const key in m) if (m[key].length > 1) { const [d, j] = key.split("_").map(Number); out.push({g: +g, d, j, ks: m[key]}); }
  }
  return out.sort((a, b) => a.d - b.d || a.j - b.j);
}

const dayHead = () => D.hari.map((h, d) => `<th class="${d === sel.today ? "today" : ""}">${esc(h.nama)}</th>`).join("");

/* ---------- Guru ---------- */
function vGuru(){
  const q = (sel.q || "").toLowerCase();
  const codes = Object.keys(D.guru).map(Number).sort((a, b) => short(a).localeCompare(short(b)))
    .filter(k => !q || gname(k).toLowerCase().includes(q) || String(k) === q);
  if (!codes.includes(sel.g)) sel.g = codes[0];
  let h = `<div class="row"><input id="q" type="search" placeholder="Cari nama atau kode guru" value="${esc(sel.q || "")}">
    <select id="g">${codes.map(k => `<option value="${k}" ${k === sel.g ? "selected" : ""}>${esc(short(k))} (${k})</option>`).join("")}</select></div>`;
  if (!codes.length) return h + `<div class="empty">Guru tidak ditemukan.</div>`;
  const L = teach[sel.g] || [], grid = {};
  L.forEach(x => (grid[x.d + "_" + x.j] = grid[x.d + "_" + x.j] || []).push(D.kelas[x.k]));
  const ks = [...new Set(L.map(x => D.kelas[x.k]))].sort();
  h += `<div class="sec">${esc(gname(sel.g))}</div><div class="sum"><span class="chip">${L.length} jam/minggu</span>` +
    D.hari.map((x, d) => `<span class="chip free">${esc(x.nama.slice(0, 3))} ${L.filter(y => y.d === d).length}</span>`).join("") + `</div>
    <div class="m" style="margin-bottom:10px">Kelas: ${ks.length ? ks.map(chip).join(" ") : "belum ada jadwal"}</div>
    <div class="wrap"><table><tr><th>Jam</th>${dayHead()}</tr>`;
  for (let j = 1; j <= maxJam; j++) {
    h += `<tr><td>${j}</td>` + D.hari.map((_, d) => {
      const g = grid[d + "_" + j];
      const c = d === sel.today ? "today" : "";
      if (g) return `<td class="${g.length > 1 ? "bad" : c} cl">${g.map(chip).join(" ")}${g.length > 1 ? "<div class='m'>bentrok</div>" : ""}</td>`;
      return `<td class="${c}"><span class="m">${esc(ev[d][j] || "")}</span></td>`;
    }).join("") + `</tr>`;
  }
  return h + `</table></div>`;
}

/* ---------- Kelas ---------- */
function vKelas(){
  if (sel.k == null) sel.k = 0;
  if (sel.hk == null) sel.hk = -1;
  const opts = ["7", "8", "9"].map(t => `<optgroup label="Kelas ${t}">` + D.kelas.map((n, i) => n[0] === t ? `<option value="${i}" ${i === sel.k ? "selected" : ""}>${n}</option>` : "").join("") + `</optgroup>`).join("");
  let h = `<div class="row"><select id="k">${opts}</select><select id="hk"><option value="-1">Semua hari</option>${D.hari.map((x, d) => `<option value="${d}" ${d === sel.hk ? "selected" : ""}>${esc(x.nama)}</option>`).join("")}</select></div>`;
  const nm = (d, j) => { const g = (cls[d][j] || [])[sel.k] || []; return g.length ? g.map(k => `${esc(short(k))} <span class="m">${k}</span>`).join("<br>") : `<span class="m">–</span>`; };
  if (sel.hk < 0) {
    h += `<div class="wrap"><table><tr><th>Jam</th>${dayHead()}</tr>`;
    for (let j = 1; j <= maxJam; j++) h += `<tr><td>${j}</td>` + D.hari.map((_, d) => `<td class="${d === sel.today ? "today" : ""}">${cls[d][j] ? nm(d, j) : `<span class="m">${esc(ev[d][j] || "")}</span>`}</td>`).join("") + `</tr>`;
    return h + `</table></div>`;
  }
  h += `<div class="wrap"><table><tr><th>Jam</th><th>Guru</th></tr>`;
  D.hari[sel.hk].rows.forEach(r => {
    h += r.cells ? `<tr><td>${r.jam}</td><td>${nm(sel.hk, r.jam)}</td></tr>` : `<tr class="ev"><td>${r.jam || ""}</td><td>${esc(r.label)}</td></tr>`;
  });
  return h + `</table></div>`;
}

/* ---------- Per jam ---------- */
function vJam(){
  const rows = D.hari[sel.d].rows.filter(r => r.jam);
  if (!rows.some(r => r.jam === sel.j)) sel.j = rows[0] && rows[0].jam;
  let h = `<div class="row"><select id="d">${D.hari.map((x, d) => `<option value="${d}" ${d === sel.d ? "selected" : ""}>${esc(x.nama)}</option>`).join("")}</select>
    <select id="j">${rows.map(r => `<option value="${r.jam}" ${r.jam === sel.j ? "selected" : ""}>Jam ke-${r.jam}${r.label ? " (" + esc(r.label) + ")" : ""}</option>`).join("")}</select></div>`;
  const c = cls[sel.d][sel.j];
  if (!c) return h + `<div class="empty">${esc(ev[sel.d][sel.j] || "Tidak ada pelajaran pada jam ini.")}</div>`;
  const busy = new Set(c.flat());
  h += `<div class="wrap"><table><tr><th>Kelas</th><th>Guru</th></tr>` + D.kelas.map((n, k) =>
    `<tr><td style="width:64px">${chip(n)}</td><td>${c[k].length ? c[k].map(g => `${esc(short(g))} <span class="m">${g}</span>`).join("<br>") : `<span class="m">–</span>`}</td></tr>`).join("") + `</table></div>`;
  const free = Object.keys(D.guru).map(Number).filter(k => !busy.has(k)).sort((a, b) => short(a).localeCompare(short(b)));
  return h + `<div class="sec">Guru tanpa jam mengajar (${free.length})</div><div class="sum">${free.map(k => `<span class="chip free">${esc(short(k))}</span>`).join("")}</div>`;
}

/* ---------- Bentrok ---------- */
function vBentrok(){
  const L = conflicts();
  if (!L.length) return `<div class="empty">Tidak ada guru yang mengajar di dua kelas pada jam yang sama.</div>`;
  return `<div class="sec">${L.length} bentrok ditemukan</div><div class="wrap"><table><tr><th>Jam</th><th>Hari</th><th>Guru</th><th>Kelas</th></tr>` +
    L.map(x => `<tr><td>${x.j}</td><td>${esc(D.hari[x.d].nama)}</td><td>${esc(short(x.g))} <span class="m">${x.g}</span></td><td class="cl">${x.ks.map(k => chip(D.kelas[k])).join(" ")}</td></tr>`).join("") + `</table></div>`;
}

function render(){
  if (!D) return;
  const f = {guru: vGuru, kelas: vKelas, jam: vJam, bentrok: vBentrok}[view];
  const keep = document.activeElement && document.activeElement.id === "q";
  $("#app").innerHTML = f();
  if (keep) { const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  $("#tabs").querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === view));
}

$("#tabs").addEventListener("click", e => {
  if (e.target.id === "re") return load(true);
  if (e.target.dataset.v) { view = e.target.dataset.v; render(); }
});
$("#app").addEventListener("input", e => { if (e.target.id === "q") { sel.q = e.target.value; render(); } });
$("#app").addEventListener("change", e => {
  const t = e.target;
  if (t.id === "g") sel.g = +t.value;
  if (t.id === "k") sel.k = +t.value;
  if (t.id === "hk") sel.hk = +t.value;
  if (t.id === "d") { sel.d = +t.value; sel.j = null; }
  if (t.id === "j") sel.j = +t.value;
  render();
});
load(false);
</script>
</body>
</html>
